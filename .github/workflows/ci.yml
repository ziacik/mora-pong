name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mora-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject host-language source
        run: |
          if find . -type f \( -name '*.py' -o -name '*.rs' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.js' -o -name '*.ts' \) | grep .; then
            echo "Host-language implementation is not allowed in mora-pong"
            exit 1
          fi
      - name: Install GTK and Mora dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 python3-pil python3-requests python3-opencv xvfb dbus-x11
          git clone --depth 1 https://github.com/ziacik/mora.git /tmp/mora
          /usr/bin/python3 -m pip install --break-system-packages --no-deps --no-build-isolation /tmp/mora
      - name: Check Mora source
        run: mora check app.mora
      - name: Check affective inference
        run: |
          mora simulate app.mora point-ended point-ended point-ended | tee /tmp/affect.log
          grep -q "frustrated.*0.25" /tmp/affect.log
      - name: Start game headlessly
        run: |
          set +e
          timeout 5s dbus-run-session -- xvfb-run -a mora run app.mora > /tmp/mora-gtk.log 2>&1
          code=$?
          cat /tmp/mora-gtk.log
          if grep -E 'Traceback|TypeError|Mora error' /tmp/mora-gtk.log; then exit 1; fi
          set -e
          if [ "$code" -ne 124 ]; then
            echo "Mora Pong exited unexpectedly with code $code"
            exit "$code"
          fi
          echo "Mora Pong stayed alive: OK"
